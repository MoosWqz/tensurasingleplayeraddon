name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run release validators
        shell: bash
        run: |
          for validator in tools/release_validation/validate_*.py; do
            python3 "$validator"
          done
          for validator in tools/datapack_validation/*/validate_*.py; do
            python3 "$validator"
          done

      - name: Build with Gradle
        shell: bash
        run: bash ./gradlew clean build --stacktrace
